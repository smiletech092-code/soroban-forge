# Guards the Homebrew tap. `Formula/soroban-forge.rb` is generated by
# `scripts/update-homebrew-formula.sh`, and the `release` workflow regenerates
# it on every tag -- so a hand-edit to the formula would be silently reverted
# at the next release. This workflow fails the PR instead.
#
# It also syntax-checks the formula, which nothing else does: a formula that
# does not parse breaks `brew install` for everyone on the tap, and the error
# would otherwise only surface after a release was already published.
name: homebrew-formula

on:
  push:
    branches: [main]
    paths:
      - "homebrew-tap/**"
      - "scripts/update-homebrew-formula.sh"
      - "Cargo.toml"
      - ".github/workflows/homebrew-formula.yml"
  pull_request:
    paths:
      - "homebrew-tap/**"
      - "scripts/update-homebrew-formula.sh"
      - "Cargo.toml"
      - ".github/workflows/homebrew-formula.yml"

permissions:
  contents: read

jobs:
  formula:
    name: validate formula
    # Ruby and Homebrew are both preinstalled on the macOS runner image.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Formula is valid Ruby
        run: ruby -c homebrew-tap/Formula/soroban-forge.rb

      - name: Formula matches the generator
        run: |
          set -euo pipefail
          version="$(
            sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml |
              sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1
          )"
          if [ -z "$version" ]; then
            echo "::error::could not read version from [workspace.package] in Cargo.toml"
            exit 1
          fi
          echo "workspace version: $version"

          # Regenerate and compare. The checked-in formula carries placeholder
          # checksums between releases, which is what `--check` emits with no
          # `--checksums` file, so the two must match byte for byte.
          bash scripts/update-homebrew-formula.sh --version "$version" --check > /tmp/expected.rb

          if ! diff -u homebrew-tap/Formula/soroban-forge.rb /tmp/expected.rb; then
            echo "::error::homebrew-tap/Formula/soroban-forge.rb is out of sync with scripts/update-homebrew-formula.sh. Regenerate it with: ./scripts/update-homebrew-formula.sh --version $version"
            exit 1
          fi
          echo "formula is in sync"

      - name: Formula style (advisory)
        run: |
          # `brew style` parses the formula with Homebrew's own rubocop rules,
          # catching deprecated DSL (for example the long-removed
          # `bottle :unneeded`) that plain `ruby -c` cannot see.
          #
          # Advisory rather than required: the `url` lines exceed rubocop's
          # 118-character limit and `Layout/LineLength`'s `AllowURI` exemption
          # may not apply to a URL containing `#{version}` interpolation.
          # Cosmetic complaints about a generated file should not block a PR,
          # but the output is still worth reading.
          if brew style homebrew-tap/Formula/soroban-forge.rb; then
            echo "brew style clean"
          else
            echo "::warning::\`brew style\` reported issues in the formula (advisory; see log above). If they are real, fix the template in scripts/update-homebrew-formula.sh and regenerate."
          fi
