# git-cliff configuration for soroban-forge
# https://git-cliff.org/docs/configuration
#
# Generate / update the CHANGELOG:
#   cargo install git-cliff          # one-time install
#   git cliff -o CHANGELOG.md        # regenerate from all tags
#   git cliff --unreleased -o CHANGELOG.md   # unreleased section only
#
# In CI (after tagging a release):
#   git cliff --tag v$VERSION -o CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to Soroban Forge will be documented here.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} ⚠ **BREAKING**{% endif %} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""

footer = """
{% for release in releases %}\
    {% if release.version %}\
        {% if release.previous.version %}\
[{{ release.version | trim_start_matches(pat="v") }}]: \
https://github.com/soroban-forge-labs/soroban-forge/compare/{{ release.previous.version }}...{{ release.version }}
        {% endif %}\
    {% else %}\
[Unreleased]: https://github.com/soroban-forge-labs/soroban-forge/compare/{{ release.previous.version }}...HEAD
    {% endif %}\
{% endfor %}
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_parsers = [
  { message = "^feat",      group = "Added"       },
  { message = "^add",       group = "Added"       },
  { message = "^fix",       group = "Fixed"       },
  { message = "^bug",       group = "Fixed"       },
  { message = "^perf",      group = "Performance" },
  { message = "^refactor",  group = "Changed"     },
  { message = "^change",    group = "Changed"     },
  { message = "^chore",     group = "Maintenance" },
  { message = "^build",     group = "Maintenance" },
  { message = "^ci",        group = "CI"          },
  { message = "^docs",      group = "Docs"        },
  { message = "^test",      group = "Testing"     },
  { message = "^revert",    group = "Reverted"    },
  { message = "^remove",    group = "Removed"     },
  { message = "^deprecate", group = "Deprecated"  },
  { message = "^Merge",     skip = true           },
  { message = "^release",   skip = true           },
  { message = "^bump",      skip = true           },
]

commit_preprocessors = [
  { pattern = "\\(#([0-9]+)\\)", replace = "([#${1}](https://github.com/soroban-forge-labs/soroban-forge/issues/${1}))" },
]

protect_breaking_commits = false
filter_commits = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"
skip_tags = "v0\\.1\\.0-beta.*"
ignore_tags = ""
topo_order = false
